  tmp_dir: "/media/splexmus/4TB_HDD1/dualrag/tmp"
  results_dir: "/media/splexmus/4TB_HDD1/dualrag/results"
  structures_dir: "/media/splexmus/4TB_HDD1/dualrag/structures"

sequence:
  backend: local
  fixture_results: null
  eggnog_data_dir: "/media/splexmus/4TB_HDD1/dualrag/databases/eggnog"
