    enabled: true
    base_url: https://alphafold.ebi.ac.uk/api
    timeout_seconds: 30
    max_retries: 3
    backoff_seconds: 1
    request_interval_seconds: 0.2
    structure_format: cif
  database_name: Foldseek-PDB
  database_version: UNVERIFIED

normalization:
  sequence_version: poc-sequence-v1
  structure_version: poc-structure-v1

