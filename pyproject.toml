[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualrag"
version = "0.1.0"
description = "Deterministic dual-retrieval proof of concept for protein function research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "PyYAML>=6.0", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
dualrag = "dualrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The host Conda environment exposes ROS pytest plugins built for another Python.
addopts = ["-p", "no:launch_testing", "-p", "no:launch_ros"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
