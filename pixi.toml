[workspace]
name = "dualrag"
version = "0.2.0"
description = "Dual-retrieval protein function research pipeline"
channels = ["conda-forge", "bioconda"]
# linux-64 is the full research platform. win-64 runs the pure-Python core (fixture
# backend, fusion, literature index/search, reports, tests); the bioinformatics
# executables below have no Windows builds, so real Phase 1 runs need Linux or WSL2.
platforms = ["linux-64", "win-64"]
channel-priority = "strict"

[dependencies]
python = "3.11.*"
numpy = ">=2"
pytest = ">=8"
ruff = ">=0.8"

[target.linux-64.dependencies]
mmseqs2 = "16.747c6.*"
foldseek = "9.427df8a.*"
hmmer = "3.4.*"
blast = ">=2.16,<2.18"
diamond = "2.0.*"
eggnog-mapper = "2.1.15.*"

[pypi-dependencies]
dualrag = { path = ".", editable = true }

[tasks]
test = "pytest -q"
lint = "ruff check src tests"
cli = "python -m dualrag --help"
check-tools = "python -m dualrag check-tools"
smoke-fixture = "python -m dualrag run --config config/config.yaml --input tests/fixtures/queries.fasta --output results/pixi-smoke"
smoke-literature-query = { cmd = "python -m dualrag build-literature-queries --run results/pixi-smoke --output results/pixi-smoke-literature-queries --context tests/fixtures/literature_query_context.tsv", depends-on = ["smoke-fixture"] }
phase4-hdd-help = "bash scripts/run_phase4_on_hdd.sh --help"
phase5-ollama-help = "bash scripts/run_phase5_ollama.sh --help"
phase6-calibration-help = "bash scripts/run_phase6_calibration.sh --help"
test-all-processes = "bash scripts/test_all_processes.sh"
validate = { depends-on = ["test", "lint", "cli", "check-tools"] }

[target.win-64.tasks]
# Same offline checks as scripts/test_all_processes.sh, without requiring bash.
test-all-processes = "python scripts/test_all_processes.py"
